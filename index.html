<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Refinery — Analytics · Data · AI</title>
    <meta name="description" content="Signal Refinery. Analytics, data, and AI in New York." />
    <meta name="theme-color" content="#eef1f2" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Signal Refinery" />
    <meta property="og:description" content="Analytics · Data · AI" />
    <meta property="og:url" content="https://signalrefinery.co/" />
    <link rel="canonical" href="https://signalrefinery.co/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="masthead" aria-labelledby="site-title">
        <h1 id="site-title"><span>SIGNAL</span><span>REFINERY</span></h1>
      </header>

      <section class="process" aria-labelledby="process-title">
        <h2 id="process-title" class="visually-hidden">From data to action</h2>
        <div class="stages">
          <figure class="stage stage-data">
            <div class="field" data-stage="data" aria-hidden="true"></div>
            <figcaption>data</figcaption>
          </figure>
          <figure class="stage stage-signal">
            <div class="field" data-stage="signal" aria-hidden="true"></div>
            <figcaption>signal</figcaption>
          </figure>
          <figure class="stage stage-insight">
            <div class="field" data-stage="insight" aria-hidden="true"></div>
            <figcaption>insight</figcaption>
          </figure>
          <figure class="stage stage-action">
            <div class="field" data-stage="action" aria-hidden="true">
              <span class="action-dot"></span>
            </div>
            <figcaption>action</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-identity">
        <p class="footer-name">Signal Refinery</p>
        <p>Analytics <span aria-hidden="true">·</span> Data <span aria-hidden="true">·</span> AI</p>
        <p>New York</p>
        <a class="footer-email" href="mailto:hello@signalrefinery.co">hello@signalrefinery.co</a>
      </div>
    </footer>

    <script src="visual.js"></script>
  </body>
</html>
